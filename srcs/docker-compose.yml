name: Inception

services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    networks:
      - "Back"
    env_file: .env
    volumes:
      - mariadb:/var/lib/mysql
    restart: unless-stopped
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    networks:
      - "Front"
    depends_on:
      - "wordpress"
    env_file: .env
    volumes:
      - wordpress:/var/www/wordpress
    ports:
      - "443:443"
    restart: unless-stopped
  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    networks:
      - "Back"
      - "Front"
    depends_on:
      - "mariadb"
    env_file: .env
    volumes:
      - wordpress:/var/www/wordpress
    restart: unless-stopped

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "/home/${USER}/data/wordpress"
  mariadb:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "/home/${USER}/data/mariadb"

networks:
  Back:
    driver: bridge
  Front:
    driver: bridge

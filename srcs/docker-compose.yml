services:
  mariadb:
    image: requirements/mariadb
    networks:
      - 'Inception'
    build:
      context: .
    env_file: .env
    volumes:
      - mariadb
    restart: unless-stopped
    expose:
      - '3306'
  nginx:
    image: requirements/nginx
    networks:
      - 'Inception'
    depends_on:
      - 'wordpress'
    build:
      context: .
    env_file: .env
    volumes:
      - wordpress
    ports:
      - "443:443"
    restart: on-failure
  wordpress:
    image: requirements/wordpress
    networks:
      - 'Inception'
    depends_on:
      - 'mariadb'
    build:
      context: .
    env_file: .env
    volumes:
      - wordpress
    expose:
      - '9000'
    restart: on-failure

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/ilhannou/data/wordpress'
  mariadb:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/ilhannou/data/mariadb'

networks:
  Inception:
    driver: bridge
